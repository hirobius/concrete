name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: HDS token discipline (no raw colors in src)
        run: pnpm tokens:discipline

      - name: Tenant overlay in sync
        run: pnpm tokens:check

      - name: Catalog schema valid
        run: pnpm catalog:validate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Launch readiness is reported, not gated: the sample catalog, placeholder
      # Stripe ids, and placeholder photos are expected RED until go-live
      # (tracked in issues #1/#2/#4). Informational only — never fails CI.
      - name: Launch readiness (informational)
        run: pnpm check:launch || true
