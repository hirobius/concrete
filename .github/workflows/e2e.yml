name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Stock runner has no preinstalled browser, so fetch one. The Playwright
      # config auto-detects a container-provided Chromium and otherwise falls
      # back to this managed install.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test (desktop + mobile)
        run: pnpm test:e2e

      - name: Upload screenshots + report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
